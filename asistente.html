    <main class="assistant-main">
        <section class="assistant-chat-shell" id="assistantChatShell" data-chat-state="idle" aria-label="Chat de Andro asistente">
            <h1 class="assistant-chat-title font-display" id="assistantChatTitle">Andro asistente</h1>

            <div class="assistant-chat-messages" id="assistantChatMessages" role="log" aria-live="polite" aria-relevant="additions" hidden></div>

            <p class="assistant-chat-status font-mono" id="assistantChatStatus" role="status" aria-live="polite" hidden></p>

            <form class="assistant-chat-form" id="assistantChatForm" novalidate>
                <label class="sr-only" for="assistantChatInput">Escribe tu mensaje para Andro asistente</label>
                <textarea
                    id="assistantChatInput"
                    class="assistant-chat-input"
                    name="message"
                    rows="1"
                    placeholder="Escribe tu mensaje..."
                    maxlength="500"
                    required
                ></textarea>
                <button type="submit" class="assistant-chat-send font-mono" id="assistantChatSend">Enviar</button>
            </form>
        </section>
